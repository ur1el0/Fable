name: Android CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Bootstrap Gradle distribution with retries
        shell: bash
        run: |
          for attempt in 1 2 3 4; do
            if ./gradlew --version; then
              exit 0
            fi
            if [ "$attempt" -lt 4 ]; then
              delay=$((attempt * 5))
              echo "Gradle distribution download failed; retrying in ${delay}s."
              sleep "$delay"
            fi
          done
          exit 1

      - name: Run unit tests and lint
        run: ./gradlew :app:testDebugUnitTest :app:lintDebug

      - name: Build debug APK and compile Android tests
        run: ./gradlew :app:assembleDebug :app:compileDebugAndroidTestKotlin

      - name: Build release APK
        run: ./gradlew :app:assembleRelease -PfableReleaseApiBaseUrl=https://api.example.invalid/api/v1/
